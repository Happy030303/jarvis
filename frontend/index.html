<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #00e5ff;
    --c2: #0af;
    --c3: #0066aa;
    --bg: #020c14;
    --bg2: #040f1a;
    --bg3: #071520;
    --text: #cceeff;
    --muted: #4a7a99;
    --glow: 0 0 20px rgba(0,229,255,0.3);
    --glow2: 0 0 40px rgba(0,229,255,0.15);
    --danger: #ff4444;
    --warn: #ffaa00;
    --success: #00ff88;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .corner {
    position: fixed;
    width: 80px;
    height: 80px;
    z-index: 1;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--c1);
  }
  .corner::before { width: 2px; height: 40px; }
  .corner::after  { width: 40px; height: 2px; }
  .corner.tl { top: 16px; left: 16px; }
  .corner.tl::before { top: 0; left: 0; }
  .corner.tl::after  { top: 0; left: 0; }
  .corner.tr { top: 16px; right: 16px; }
  .corner.tr::before { top: 0; right: 0; }
  .corner.tr::after  { top: 0; right: 0; }
  .corner.bl { bottom: 16px; left: 16px; }
  .corner.bl::before { bottom: 0; left: 0; }
  .corner.bl::after  { bottom: 0; left: 0; }
  .corner.br { bottom: 16px; right: 16px; }
  .corner.br::before { bottom: 0; right: 0; }
  .corner.br::after  { bottom: 0; right: 0; }

  header {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 900px;
    padding: 28px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 28px;
    color: var(--c1);
    letter-spacing: 8px;
    text-shadow: var(--glow);
  }
  .logo span { color: var(--muted); font-size: 13px; display: block; letter-spacing: 4px; margin-top: -4px; }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    transition: all 0.3s;
  }
  .status-dot.offline { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .status-dot.busy    { background: var(--warn);   box-shadow: 0 0 8px var(--warn);   animation: pulse-dot 1s infinite; }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  main {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 900px;
    padding: 24px 24px 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    flex: 1;
  }

  .orb-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 32px 0;
  }

  .orb-wrapper {
    position: relative;
    width: 160px;
    height: 160px;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid transparent;
    animation: spin 6s linear infinite;
  }
  .ring-1 {
    inset: -20px;
    border-top-color: rgba(0,229,255,0.4);
    border-right-color: rgba(0,229,255,0.1);
    animation-duration: 6s;
  }
  .ring-2 {
    inset: -10px;
    border-top-color: rgba(0,180,255,0.3);
    border-left-color: rgba(0,180,255,0.1);
    animation-direction: reverse;
    animation-duration: 4s;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .mic-btn {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #0a2030, var(--bg));
    border: 2px solid rgba(0,229,255,0.3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 20px rgba(0,229,255,0.15);
    outline: none;
  }
  .mic-btn:hover {
    border-color: rgba(0,229,255,0.7);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 30px rgba(0,229,255,0.35);
  }
  .mic-btn.listening {
    border-color: var(--c1);
    animation: mic-pulse 1.2s ease-in-out infinite;
  }
  .mic-btn.thinking {
    border-color: var(--warn);
    animation: think-pulse 1s ease-in-out infinite;
  }
  .mic-btn.processing {
    border-color: var(--warn);
    cursor: wait;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 20px rgba(0,229,255,0.3); }
    50%       { box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 60px rgba(0,229,255,0.6), 0 0 100px rgba(0,229,255,0.2); }
  }
  @keyframes think-pulse {
    0%, 100% { box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 20px rgba(255,170,0,0.3); }
    50%       { box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 60px rgba(255,170,0,0.6); }
  }

  .mic-icon {
    width: 44px;
    height: 44px;
    fill: none;
    stroke: var(--c1);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.3s;
  }
  .mic-btn.listening  .mic-icon { stroke: var(--c1);   filter: drop-shadow(0 0 6px var(--c1));   }
  .mic-btn.thinking   .mic-icon { stroke: var(--warn); filter: drop-shadow(0 0 6px var(--warn)); }
  .mic-btn.processing .mic-icon { stroke: var(--warn); filter: drop-shadow(0 0 6px var(--warn)); }

  .waveform {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 40px;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .waveform.active { opacity: 1; }
  .bar {
    width: 3px;
    border-radius: 3px;
    background: var(--c1);
    box-shadow: 0 0 6px var(--c1);
    animation: wave 0.8s ease-in-out infinite;
    min-height: 4px;
  }
  .bar:nth-child(1) { animation-delay: 0s;    }
  .bar:nth-child(2) { animation-delay: 0.1s;  }
  .bar:nth-child(3) { animation-delay: 0.2s;  }
  .bar:nth-child(4) { animation-delay: 0.3s;  }
  .bar:nth-child(5) { animation-delay: 0.4s;  }
  .bar:nth-child(6) { animation-delay: 0.3s;  }
  .bar:nth-child(7) { animation-delay: 0.2s;  }
  .bar:nth-child(8) { animation-delay: 0.1s;  }
  .bar:nth-child(9) { animation-delay: 0s;    }
  @keyframes wave {
    0%, 100% { height: 6px; }
    50%       { height: 32px; }
  }

  /* Thinking dots on waveform when in THINKING state */
  .waveform.thinking .bar {
    background: var(--warn);
    box-shadow: 0 0 6px var(--warn);
    animation: think-bar 1s ease-in-out infinite;
  }
  @keyframes think-bar {
    0%, 100% { height: 4px; }
    50%       { height: 20px; }
  }

  .state-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    transition: color 0.3s;
    min-height: 20px;
  }
  .state-label.active  { color: var(--c1);     text-shadow: 0 0 10px var(--c1);     }
  .state-label.warn    { color: var(--warn);   text-shadow: 0 0 10px var(--warn);   }
  .state-label.success { color: var(--success); }

  .category-pill {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 4px 14px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.5s;
    min-height: 24px;
  }
  .category-pill.GENERAL  { background: rgba(0,255,136,0.1);  border: 1px solid var(--success); color: var(--success); opacity: 1; }
  .category-pill.REALTIME { background: rgba(0,229,255,0.1);  border: 1px solid var(--c1);      color: var(--c1);      opacity: 1; }
  .category-pill.SYSTEM   { background: rgba(255,170,0,0.1);  border: 1px solid var(--warn);    color: var(--warn);    opacity: 1; }

  .hline {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,229,255,0.2), transparent);
  }

  .chat-panel {
    background: var(--bg2);
    border: 1px solid rgba(0,229,255,0.1);
    border-radius: 8px;
    overflow: hidden;
  }
  .chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(0,229,255,0.08);
  }
  .chat-header-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
  }
  .clear-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    background: none;
    border: 1px solid rgba(0,229,255,0.15);
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .clear-btn:hover { color: var(--danger); border-color: var(--danger); }

  .chat-messages {
    padding: 16px;
    min-height: 200px;
    max-height: 340px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 2px; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    line-height: 2;
    margin: auto;
    padding: 40px 0;
  }

  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--muted);
    background: rgba(0,229,255,0.05);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 4px;
    padding: 4px 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .msg-bubble {
    background: var(--bg3);
    border: 1px solid rgba(0,229,255,0.1);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 15px;
    line-height: 1.5;
    max-width: 75%;
    word-break: break-word;
  }
  .msg.user .msg-bubble { background: rgba(0,229,255,0.05); border-color: rgba(0,229,255,0.2); }

  .typing-indicator { display: flex; gap: 6px; padding: 4px 0; }
  .typing-dots { display: flex; gap: 4px; align-items: center; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--c1);
    animation: dot-bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid rgba(0,229,255,0.08);
  }
  .text-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    outline: none;
    transition: border-color 0.2s;
  }
  .text-input:focus { border-color: rgba(0,229,255,0.4); }
  .text-input::placeholder { color: var(--muted); }
  .send-btn {
    background: rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--c1);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .send-btn:hover  { background: rgba(0,229,255,0.15); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .stats-row {
    display: flex;
    gap: 12px;
  }
  .stat-card {
    flex: 1;
    background: var(--bg2);
    border: 1px solid rgba(0,229,255,0.08);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }
  .stat-card.g { border-top: 2px solid var(--success); }
  .stat-card.r { border-top: 2px solid var(--c1);      }
  .stat-card.s { border-top: 2px solid var(--warn);    }
  .stat-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 24px;
    color: var(--c1);
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(4,15,26,0.95);
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 12px 24px;
    border-radius: 6px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 100;
    pointer-events: none;
    max-width: 80vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<header>
  <div class="logo">JARVIS<span>JUST A RATHER VERY INTELLIGENT SYSTEM</span></div>
  <div class="status-badge">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">ONLINE</span>
  </div>
</header>

<main>
  <div class="orb-section">
    <div class="orb-wrapper">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <button class="mic-btn" id="micBtn" title="Click to speak">
        <svg class="mic-icon" viewBox="0 0 24 24">
          <rect x="9" y="2" width="6" height="13" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8"  y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>

    <div class="waveform" id="waveform">
      <div class="bar" style="height:8px"></div>
      <div class="bar" style="height:16px"></div>
      <div class="bar" style="height:24px"></div>
      <div class="bar" style="height:32px"></div>
      <div class="bar" style="height:24px"></div>
      <div class="bar" style="height:32px"></div>
      <div class="bar" style="height:24px"></div>
      <div class="bar" style="height:16px"></div>
      <div class="bar" style="height:8px"></div>
    </div>

    <div class="state-label" id="stateLabel">CLICK MIC TO SPEAK</div>
    <div class="category-pill" id="categoryPill"></div>
  </div>

  <div class="hline"></div>

  <div class="chat-panel">
    <div class="chat-header">
      <span class="chat-header-title">// CONVERSATION LOG</span>
      <button class="clear-btn" id="clearBtn">CLEAR</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state" id="emptyState">
        NO ACTIVE SESSION<br>CLICK MIC OR TYPE TO BEGIN
      </div>
    </div>
    <div class="input-row">
      <input class="text-input" id="textInput" type="text" placeholder="TYPE A COMMAND..." autocomplete="off"/>
      <button class="send-btn" id="sendBtn">SEND</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card g">
      <div class="stat-label">GENERAL</div>
      <div class="stat-value" id="countGeneral">0</div>
    </div>
    <div class="stat-card r">
      <div class="stat-label">REALTIME</div>
      <div class="stat-value" id="countRealtime">0</div>
    </div>
    <div class="stat-card s">
      <div class="stat-label">SYSTEM</div>
      <div class="stat-value" id="countSystem">0</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:5000';

let counts  = { GENERAL: 0, REALTIME: 0, SYSTEM: 0 };
let isBusy  = false;           // true while listen OR ask is in-flight
let abortCtrl = null;          // AbortController for cancelling in-flight fetch

const micBtn     = document.getElementById('micBtn');
const stateLabel = document.getElementById('stateLabel');
const waveform   = document.getElementById('waveform');
const catPill    = document.getElementById('categoryPill');
const messages   = document.getElementById('chatMessages');
const textInput  = document.getElementById('textInput');
const sendBtn    = document.getElementById('sendBtn');
const clearBtn   = document.getElementById('clearBtn');
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const toast      = document.getElementById('toast');

// ── Status poll ──────────────────────────────────────────
async function checkStatus() {
  try {
    const r = await fetch(`${API}/status`, { signal: AbortSignal.timeout(3000) });
    if (r.ok) { statusDot.className = 'status-dot'; statusText.textContent = 'ONLINE'; }
    else throw 0;
  } catch {
    statusDot.className = 'status-dot offline';
    statusText.textContent = 'OFFLINE';
  }
}
checkStatus();
setInterval(checkStatus, 10000);

// ── UI state helpers ─────────────────────────────────────
// mode: '' | 'listening' | 'thinking' | 'warn'
function setState(mode, labelText) {
  stateLabel.textContent  = labelText;
  stateLabel.className    = 'state-label' + (mode ? ' ' + (mode === 'listening' ? 'active' : 'warn') : '');
  micBtn.className        = 'mic-btn' + (mode ? ' ' + mode : '');
  waveform.classList.toggle('active',    mode === 'listening' || mode === 'thinking');
  waveform.classList.toggle('thinking',  mode === 'thinking');
}

function resetState() {
  setState('', 'CLICK MIC TO SPEAK');
  statusDot.className = 'status-dot';
  isBusy = false;
  sendBtn.disabled = false;
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function showCategory(cat) {
  catPill.textContent = cat;
  catPill.className   = 'category-pill ' + cat;
  setTimeout(() => { catPill.className = 'category-pill'; }, 5000);
}

// ── Chat helpers ─────────────────────────────────────────
function addMsg(role, text) {
  document.getElementById('emptyState')?.remove();
  const isUser = role === 'user';
  const div = document.createElement('div');
  div.className = `msg ${isUser ? 'user' : 'jarvis'}`;
  div.innerHTML = `
    <div class="msg-avatar">${isUser ? 'YOU' : 'J'}</div>
    <div class="msg-bubble">${escHtml(text)}</div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addTyping() {
  document.getElementById('emptyState')?.remove();
  const div = document.createElement('div');
  div.className = 'msg jarvis';
  div.id = 'typingMsg';
  div.innerHTML = `
    <div class="msg-avatar">J</div>
    <div class="msg-bubble">
      <div class="typing-indicator">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}
function removeTyping() { document.getElementById('typingMsg')?.remove(); }

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateCounts(cat) {
  counts[cat] = (counts[cat] || 0) + 1;
  document.getElementById('countGeneral').textContent  = counts.GENERAL;
  document.getElementById('countRealtime').textContent = counts.REALTIME;
  document.getElementById('countSystem').textContent   = counts.SYSTEM;
}

// ── Cancel any in-flight request ────────────────────────
function cancelCurrent() {
  if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; }
  // Tell server to stop speaking
  fetch(`${API}/stop`, { method: 'POST' }).catch(() => {});
}

// ── /ask ────────────────────────────────────────────────
async function sendToJarvis(text) {
  isBusy = true;
  sendBtn.disabled = true;
  addMsg('user', text);
  addTyping();
  setState('thinking', 'THINKING...');
  statusDot.className = 'status-dot busy';

  abortCtrl = new AbortController();
  try {
    const r    = await fetch(`${API}/ask`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ text }),
      signal:  abortCtrl.signal
    });
    const data = await r.json();
    removeTyping();

    if (!r.ok || data.error) {
      showToast('ERROR: ' + (data.error || 'Unknown error'));
    } else {
      addMsg('jarvis', data.response);
      showCategory(data.category);
      updateCounts(data.category);
    }
  } catch (err) {
    removeTyping();
    if (err.name !== 'AbortError') showToast('Server not reachable. Is server.py running?');
  }

  resetState();
}

// ── ONE-SHOT listen cycle ────────────────────────────────
async function doListen() {
  isBusy = true;
  sendBtn.disabled = true;
  setState('listening', 'LISTENING...');
  statusDot.className = 'status-dot busy';

  abortCtrl = new AbortController();
  try {
    const r    = await fetch(`${API}/listen`, { method: 'POST', signal: abortCtrl.signal });
    const data = await r.json();

    if (!r.ok || data.error) {
      showToast(data.error || 'Mic error');
      resetState();
      return;
    }

    // Got text → now ask (state will update inside sendToJarvis)
    await sendToJarvis(data.text);

  } catch (err) {
    removeTyping();
    if (err.name !== 'AbortError') showToast('Server not reachable.');
    resetState();
  }
}

// ── Mic button — ONE click = ONE listen cycle ────────────
micBtn.addEventListener('click', () => {
  // Always stop speech first (even when idle)
  cancelCurrent();

  if (isBusy) {
    // Was busy (listening/thinking) → cancel + reset, don't start new listen
    resetState();
    return;
  }
  // Was idle → start listening
  doListen();
});

// ── Text input ───────────────────────────────────────────
sendBtn.addEventListener('click', () => {
  const t = textInput.value.trim();
  if (!t) return;
  textInput.value = '';
  cancelCurrent();       // stop any ongoing speech immediately
  isBusy = false;        // allow sendToJarvis to run even if previous was busy
  sendToJarvis(t);
});

textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendBtn.click();
});

// ── Clear ────────────────────────────────────────────────
clearBtn.addEventListener('click', () => {
  messages.innerHTML = '<div class="empty-state" id="emptyState">NO ACTIVE SESSION<br>CLICK MIC OR TYPE TO BEGIN</div>';
  catPill.className  = 'category-pill';
  counts = { GENERAL: 0, REALTIME: 0, SYSTEM: 0 };
  document.getElementById('countGeneral').textContent  = 0;
  document.getElementById('countRealtime').textContent = 0;
  document.getElementById('countSystem').textContent   = 0;
});
</script>
